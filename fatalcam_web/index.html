<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141014">
<title>Fatal Cam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Mesma paleta e tipografia do deck do pitch */
  :root { --fundo: #141014; --cartao: #221a21; --borda: #3a2e36; --vinho: #2a1520; --rosa: #f0245a; --rosa-escuro: #c81d4b; --rosa-claro: #ff8fab; --texto: #f6f1f3; --texto2: #b9aeb4; --texto3: #8c8288; }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  body { font-family: 'DM Sans', system-ui, sans-serif; background: radial-gradient(circle at 85% 0%, #3a1226 0%, var(--fundo) 55%) fixed, var(--fundo); color: var(--texto); min-height: 100vh; }
  header { padding: 18px 16px; padding-top: max(18px, env(safe-area-inset-top)); display: flex; align-items: center; justify-content: center; gap: 8px; font-family: Montserrat, sans-serif; font-weight: 900; font-size: 22px; letter-spacing: -.5px; border-bottom: 1px solid var(--borda); }
  header span { color: var(--rosa); }
  header svg { width: 28px; height: 28px; color: var(--rosa); }
  main { max-width: 480px; margin: 0 auto; padding: 20px 16px 32px; }
  .card { background: var(--cartao); border: 1px solid var(--borda); border-radius: 1rem; padding: 24px 20px; text-align: center; }
  .card + .card { margin-top: 16px; }
  .numero { font-size: 12px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: var(--rosa); }
  h1 { font-family: Montserrat, sans-serif; font-size: 24px; font-weight: 800; margin: 6px 0 6px; }
  p { color: var(--texto2); line-height: 1.5; font-size: 15px; }
  .botao { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 60px; margin-top: 18px; background: var(--rosa); color: #fff; border: 0; font: inherit; font-weight: 700; font-size: 18px; padding: 16px; border-radius: 9999px; text-decoration: none; cursor: pointer; }
  .botao:active { background: var(--rosa-escuro); }
  .botao:disabled { opacity: .55; }
  .botao svg { width: 24px; height: 24px; flex: none; }
  .botao.escuro { background: transparent; color: var(--texto); border: 1.5px solid var(--borda); }
  .status { font-size: 13px; margin-top: 12px; min-height: 1.4em; color: var(--texto2); }
  .status.erro { color: var(--rosa-claro); font-weight: 700; }
  .previa { max-width: 100%; max-height: 220px; border-radius: .75rem; margin: 16px auto 0; display: block; border: 1px solid var(--borda); }
  input[type=file] { display: none; }

  /* resultado do teste: tela cheia, a pessoa fecha para testar de novo */
  .resultado { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 32px 24px; padding-bottom: max(32px, env(safe-area-inset-bottom)); text-align: center; animation: entra .25s ease-out; }
  .resultado.ok { background: radial-gradient(circle at 50% 38%, #6a1736 0%, var(--fundo) 70%); }
  .resultado.nao { background: radial-gradient(circle at 50% 38%, #2c2630 0%, var(--fundo) 70%); }
  .resultado .icone { width: 132px; height: 132px; }
  .resultado.ok .icone { color: var(--rosa); }
  .resultado.nao .icone { color: var(--texto3); }
  .resultado .rotulo { font-size: 13px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase; }
  .resultado.ok .rotulo { color: var(--rosa); }
  .resultado.nao .rotulo { color: var(--texto3); }
  .resultado h2 { font-family: Montserrat, sans-serif; font-size: 34px; font-weight: 900; line-height: 1.1; letter-spacing: -.5px; max-width: 340px; }
  .resultado p { max-width: 320px; }
  .resultado .botao { max-width: 340px; margin-top: 10px; }
  .resultado .fechar { position: absolute; top: max(16px, env(safe-area-inset-top)); right: 16px; width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--borda); background: #00000040; color: var(--texto); display: grid; place-items: center; cursor: pointer; }
  .resultado .fechar svg { width: 22px; height: 22px; }
  @keyframes entra { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<header>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3.5"/></svg>
  <div>fatal<span>cam</span></div>
</header>
<main>
  <section class="card">
    <span class="numero">Passo 1</span>
    <h1>Tirar foto</h1>
    <p>A foto sai com um código invisível gravado nos pixels.</p>
    <input type="file" id="foto" accept="image/*" capture="environment">
    <button class="botao" id="btn-foto">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3.5"/></svg>
      Tirar foto
    </button>
    <p class="status" id="status-foto"></p>
    <img class="previa" id="previa" alt="Foto com selo" hidden>
    <a class="botao escuro" id="baixar" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
      Baixar foto
    </a>
  </section>

  <section class="card">
    <span class="numero">Passo 2</span>
    <h1>Testar foto</h1>
    <p>Escolha uma foto da galeria para ver se ela tem o selo.</p>
    <input type="file" id="imagem" accept="image/*">
    <button class="botao" id="btn-testar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>
      Testar foto
    </button>
    <p class="status" id="status-teste"></p>
    <div id="resultado" hidden></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>
<script type="module">
  import { Marca } from "./marca.js";

  const CODIGO = "FATALCAM";      // o que vai gravado na foto (maximo 8 caracteres)
  const MAX_LADO = 4096;          // mesmo limite do fatalcam_api; tambem evita estourar o canvas do iPhone
  const ort = window.ort;
  ort.env.wasm.wasmPaths = "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/";
  const $ = id => document.getElementById(id);

  const sessoes = {};
  const sessao = nome => (sessoes[nome] ??= ort.InferenceSession.create(`modelos/${nome}.onnx`, { executionProviders: ["wasm"] })
    .catch(e => { delete sessoes[nome]; throw e; }));
  const status = (id, texto, erro) => { $(id).textContent = texto; $(id).classList.toggle("erro", !!erro); };

  // <img> aplica a rotacao do EXIF, como o exif_transpose do fatalcam_api
  async function abrir(arquivo) {
    const url = URL.createObjectURL(arquivo);
    try {
      const img = new Image();
      img.src = url;
      await img.decode();
      const escala = Math.min(1, MAX_LADO / Math.max(img.naturalWidth, img.naturalHeight));
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(img.naturalWidth * escala);
      canvas.height = Math.round(img.naturalHeight * escala);
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      return canvas;
    } finally {
      URL.revokeObjectURL(url);
    }
  }
  const pixels = canvas => canvas.getContext("2d").getImageData(0, 0, canvas.width, canvas.height);

  // ------------------------------------------------------------ 1. tirar foto
  $("btn-foto").onclick = () => $("foto").click();
  $("foto").onchange = async () => {
    const arquivo = $("foto").files[0];
    $("foto").value = "";
    if (!arquivo) return;
    $("btn-foto").disabled = true;
    try {
      status("status-foto", "Gravando o selo... (na primeira vez demora um pouco)");
      const canvas = await abrir(arquivo);
      const img = pixels(canvas);
      await new Marca(ort, await sessao("encoder_Q"), null).gravar(img, CODIGO);
      canvas.getContext("2d").putImageData(img, 0, 0);
      const blob = await new Promise(ok => canvas.toBlob(ok, "image/jpeg", 0.95));
      if ($("baixar").href) URL.revokeObjectURL($("baixar").href);
      const url = URL.createObjectURL(blob);
      $("previa").src = url;
      $("previa").hidden = false;
      $("baixar").href = url;
      $("baixar").download = `fatalcam_${Date.now() % 100000}.jpg`;
      $("baixar").hidden = false;
      status("status-foto", "Pronto! Baixe a foto e teste no passo 2.");
    } catch (e) {
      status("status-foto", "Não deu para gravar o selo: " + e.message, true);
    } finally {
      $("btn-foto").disabled = false;
    }
  };

  // ------------------------------------------------------------ 2. testar foto
  const ICONE_OK = '<svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z"/><path d="m9 12 2 2 4-4"/></svg>';
  const ICONE_NAO = '<svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/></svg>';
  const ICONE_FECHAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>';
  const RESULTADO = {
    ok: { rotulo: "Código encontrado", titulo: "Verificado com segurança", texto: "Esta foto tem o código de segurança da Fatal Cam, mesmo se for um print." },
    nao: { rotulo: "Sem código", titulo: "Código não encontrado", texto: "Esta foto não foi tirada pela Fatal Cam." },
  };

  // ao fechar o resultado, o passo 1 volta ao inicio para a proxima pessoa testar do zero
  function limparFoto() {
    if ($("baixar").href) URL.revokeObjectURL($("baixar").href);
    $("baixar").removeAttribute("href");
    $("baixar").hidden = true;
    $("previa").removeAttribute("src");
    $("previa").hidden = true;
    status("status-foto", "");
  }
  const fecharResultado = () => { $("resultado").hidden = true; limparFoto(); };
  document.addEventListener("keydown", e => { if (e.key === "Escape") fecharResultado(); });

  function mostrarResultado(ok) {
    const r = RESULTADO[ok ? "ok" : "nao"];
    $("resultado").className = "resultado " + (ok ? "ok" : "nao");
    $("resultado").innerHTML = `<button class="fechar" aria-label="Fechar">${ICONE_FECHAR}</button>`
      + (ok ? ICONE_OK : ICONE_NAO)
      + `<div class="rotulo">${r.rotulo}</div><h2>${r.titulo}</h2><p>${r.texto}</p>`
      + `<button class="botao" id="testar-outra">Testar outra foto</button>`;
    $("resultado").querySelector(".fechar").onclick = fecharResultado;
    $("testar-outra").onclick = () => { fecharResultado(); $("imagem").click(); };
    $("resultado").hidden = false;
  }

  $("btn-testar").onclick = () => $("imagem").click();
  $("imagem").onchange = async () => {
    const arquivo = $("imagem").files[0];
    $("imagem").value = "";
    if (!arquivo) return;
    $("resultado").hidden = true;
    $("btn-testar").disabled = true;
    try {
      status("status-teste", "Procurando o selo... (na primeira vez demora um pouco)");
      const canvas = await abrir(arquivo);
      const texto = await new Marca(ort, null, await sessao("decoder_Q")).ler(pixels(canvas));
      mostrarResultado(texto === CODIGO);
      status("status-teste", "");
    } catch (e) {
      status("status-teste", "Não deu para ler a foto: " + e.message, true);
    } finally {
      $("btn-testar").disabled = false;
    }
  };
</script>
</body>
</html>
