<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#263238">
<title>Fatal Cam - Verificador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Paleta da Fatal Model (fatalmodel.com) */
  :root { --coral: #e25352; --coral-escuro: #c04657; --grafite: #263238; --cinza: #eceff1; --borda: #cfd8dc; --texto2: #5d7a89; --verde: #43a047; --verde-claro: #e8f5e9; }
  * { box-sizing: border-box; margin: 0; }
  [hidden] { display: none !important; }
  body { font-family: Montserrat, system-ui, sans-serif; background: var(--cinza); color: var(--grafite); min-height: 100vh; }
  header { background: var(--grafite); color: #fff; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 20px; letter-spacing: -.3px; }
  .logo span { color: var(--coral); }
  .logo svg { width: 26px; height: 26px; }
  .chip { font-size: 12px; font-weight: 600; background: #ffffff1a; padding: 6px 12px; border-radius: 9999px; }
  main { max-width: 440px; margin: 0 auto; padding: 20px 16px 32px; }
  .card { background: #fff; border-radius: 1rem; padding: 24px 20px; text-align: center; box-shadow: 0 1px 3px #26323814; }
  .rotulo { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: var(--coral); }
  h1 { font-size: 21px; font-weight: 700; margin: 6px 0 8px; line-height: 1.3; }
  p { color: var(--texto2); line-height: 1.55; font-size: 14px; }
  .upload { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: 20px; border: 2px dashed var(--borda); border-radius: 1rem; padding: 28px 16px; cursor: pointer; color: var(--texto2); font-size: 14px; }
  .upload svg { width: 36px; height: 36px; color: var(--coral); }
  .upload strong { color: var(--coral); font-size: 15px; }
  input[type=file] { display: none; }
  .previa { width: 100%; border-radius: .75rem; margin-top: 16px; display: block; }
  #resultado { margin-top: 16px; padding: 18px; border-radius: 1rem; display: none; text-align: center; }
  #resultado.achou { display: block; background: var(--verde-claro); color: var(--verde); }
  #resultado.achou.nivel2 { background: #fff8e1; color: #a87900; }
  .nivel { display: inline-block; margin-top: 8px; font-size: 13px; font-weight: 700; padding: 4px 12px; border-radius: 9999px; background: #ffffffb3; }
  #resultado.nada { display: block; background: var(--cinza); color: var(--texto2); }
  #resultado.erro { display: block; background: #fae3e3; color: var(--coral-escuro); }
  #resultado .titulo { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; }
  #resultado .titulo svg { width: 18px; height: 18px; }
  .id { font-size: 44px; font-weight: 800; margin-top: 2px; letter-spacing: 1px; }
  .id-sub { font-size: 12px; color: var(--texto2); }
</style>
</head>
<body>
<header>
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3.5"/></svg>
    <div>fatal<span>cam</span></div>
  </div>
  <div class="chip">Verificador</div>
</header>
<main>
  <div class="card">
    <div class="rotulo">Verificar origem</div>
    <h1>De qual perfil saiu esta foto?</h1>
    <p>Envie a foto ou um print dela. Nada é salvo.</p>
    <label class="upload" for="imagem">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
      <strong id="rotulo">Escolher imagem</strong>
      <span>JPG, PNG ou print de tela</span>
    </label>
    <input type="file" id="imagem" accept="image/*">
    <div id="resultado"></div>
    <img class="previa" id="previa" alt="" hidden>
  </div>
</main>
<script>
  const $ = id => document.getElementById(id);
  const ESCUDO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>';

  $("imagem").onchange = async () => {
    const arquivo = $("imagem").files[0];
    if (!arquivo) return;
    $("previa").src = URL.createObjectURL(arquivo);
    $("previa").hidden = false;
    $("resultado").className = "";
    $("rotulo").textContent = "Lendo o selo...";
    try {
      const dados = new FormData();
      dados.append("imagem", arquivo);
      const r = await fetch("/ler", { method: "POST", body: dados });
      if (!r.ok) throw new Error((await r.json()).detail || r.status);
      const { perfil, nivel } = await r.json();
      if (perfil) {
        const NIVEL = { 1: "Nível 1 · tirada na hora pela Fatal Cam", 2: "Nível 2 · enviada da galeria" };
        $("resultado").className = nivel === 2 ? "achou nivel2" : "achou";
        $("resultado").innerHTML = `<div class="titulo">${ESCUDO} Selo da Fatal Cam encontrado</div><div class="id"></div><div class="id-sub">ID do perfil de origem</div><div class="nivel"></div>`;
        $("resultado").querySelector(".id").textContent = perfil;
        $("resultado").querySelector(".nivel").textContent = NIVEL[nivel];
      } else {
        $("resultado").className = "nada";
        $("resultado").textContent = "Nenhum selo da Fatal Cam nesta imagem.";
      }
    } catch (e) {
      $("resultado").className = "erro";
      $("resultado").textContent = "Erro ao ler: " + e.message;
    } finally {
      $("rotulo").textContent = "Escolher outra imagem";
      $("imagem").value = "";
    }
  };
</script>
</body>
</html>
